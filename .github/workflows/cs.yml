name: CS

on: [ pull_request ]

permissions:  # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  ecs:
    name: Coding Standards (PHP)

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: "none"
          php-version-file: ".php-version"
          extensions: intl, ctype, iconv

      - name: "Set up problem matchers for PHP"
        run: "echo \"::add-matcher::${{ runner.tool_cache }}/php.json\""

      - uses: "ramsey/composer-install@v4"

      - name: Run EasyCodingStandard
        run: vendor/bin/ecs check

  rector:
    name: Rector (PHP)

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: "none"
          php-version-file: ".php-version"
          extensions: intl, ctype, iconv

      - name: "Set up problem matchers for PHP"
        run: "echo \"::add-matcher::${{ runner.tool_cache }}/php.json\""

      - uses: "ramsey/composer-install@v4"

      - name: Run Rector
        run: vendor/bin/rector --dry-run

  composer-normalize:
    name: Composer Normalize

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: "none"
          php-version-file: ".php-version"
          extensions: intl, ctype, iconv

      - uses: "ramsey/composer-install@v4"

      - name: Run composer normalize
        run: composer normalize --no-update-lock --diff --dry-run

  lint:
    name: Lint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: github/super-linter@v7
        env:
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSS_FILE_NAME: .stylelintrc.json
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_XML: true
          VALIDATE_MD: true
          VALIDATE_GITLEAKS: true
          VALIDATE_BASH: true
          # PHP_BUILTIN is deliberately absent: it runs `php -l` with the PHP bundled in the
          # super-linter image, which is older than the 8.4 this project requires, so it reports
          # valid code such as `new PlatformConfiguration()->getTreeBuilder()` as a parse error.
          # The ECS, Rector, PHPStan and PHPUnit jobs all parse every file with the real 8.4.
          # It has to be left out rather than set to false — super-linter refuses a mix of
          # VALIDATE_* true and false values.
          LINTER_RULES_PATH: .
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_CSS: true
